name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:        # run it manually from the Actions tab

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: coffee-shop
  TARGET_TAG_NAME: coffee-dev-app
  APP_ENV: dev
  ORDERS_TABLE: coffee-dev-orders

permissions:
  contents: read

jobs:
  # Runs on PRs only: prove the image still builds. No AWS access needed.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (validation only)
        run: docker build -t coffee-shop:pr-${{ github.sha}} app

  # Runs on main only: build, push, deploy. 
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build -t "$IMAGE" app
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Find target instance
        id: target
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$TARGET_TAG_NAME" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[0].InstanceId" \
            --output text)
          echo "instance_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Found: $ID"

      - name: Deploy via SSM Run Command
        if: steps.target.outputs.instance_id != '' && steps.target.outputs.instance_id != 'None'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
        run: |
          cat > params.json <<EOF
          {
            "commands": [
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY}",
              "docker pull ${IMAGE}",
              "docker rm -f coffee-shop 2>/dev/null || true",
              "docker run -d --name coffee-shop --restart unless-stopped -p 80:8080 -e APP_ENV=${APP_ENV} -e ORDERS_TABLE=${ORDERS_TABLE} -e AWS_DEFAULT_REGION=${AWS_REGION} ${IMAGE}",
              "docker ps --filter name=coffee-shop"
            ]
          }
          EOF

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)

          echo "SSM command: $CMD_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

      - name: Note if no instance was running
        if: steps.target.outputs.instance_id == '' || steps.target.outputs.instance_id == 'None'
        run: echo "::notice::No running coffee-dev-app instance found - image was built and pushed, but nothing was deployed."